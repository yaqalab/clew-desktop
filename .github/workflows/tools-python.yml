# The Python tools on Linux and macOS, on every push that changes them: the analysis engine (with
# R and PSPP on Linux, Python everywhere; SPSS is not available) and the dictation server with its
# fake engine (no Whisper, no model). The packed dictation server is built and checked with real
# speech by dictation.yml.
name: Tools - analysis and dictation

on:
  push:
    paths:
      - 'tools/analysis-server/**'
      - 'tools/stt-server/**'
      - 'tools/VERSION'
      - '.github/workflows/tools-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: R and PSPP for the analysis engine (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq r-base-core pspp
      - name: A Python with the analysis engine's libraries
        run: python -m pip install --quiet pandas numpy scipy statsmodels
      - name: Analysis engine
        working-directory: tools/analysis-server
        env:
          CLEW_TEST_PYTHON: python
        run: |
          python -m unittest discover -s tests -v
          python clew_analysis_server.py --check
      - name: Dictation server (fake engine; PyAV for the decoding tests)
        working-directory: tools/stt-server
        run: |
          python -m pip install --quiet --disable-pip-version-check -e ".[test]" av
          python -m pytest -q
