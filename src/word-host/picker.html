<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>Apply a code</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <section id="find">
      <input id="q" type="search" placeholder="Find a code…" autocomplete="off" spellcheck="false" aria-label="Find a code" />
      <ul id="list" role="listbox" aria-label="Codes"></ul>
    </section>
    <section id="new" hidden>
      <h1>New code</h1>
      <input id="name" type="text" placeholder="Name" aria-label="Name" autocomplete="off" />
      <div id="swatches" role="radiogroup" aria-label="Colour"></div>
      <textarea id="desc" rows="3" placeholder="Description (optional)" aria-label="Description"></textarea>
      <div class="row">
        <button id="create" class="primary">Create and apply</button>
        <button id="back">Back</button>
      </div>
    </section>
    <p id="msg" role="status" hidden></p>
    <footer>
      <button id="full" class="link">Open Yaqatw</button>
      <span class="muted" id="keys">↑↓ choose · Enter applies · Esc closes</span>
    </footer>
    <script src="colors.js"></script>
    <script src="picker.js"></script>
  </body>
</html>
